<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Frame Analyzer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Custom styles */
        html, body {
            height: 100vh; /* Use 100vh for full viewport height */
            width: 100vw;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Tailwind gray-900 */
            color: #f3f4f6; /* Tailwind gray-100 */
            overflow: hidden; /* Prevent scrolling */
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Style for the custom control bar */
        .controls-bar {
            flex-shrink: 0; /* Prevent control bar from shrinking */
        }
        
        /* Custom styles for select dropdown to match dark theme */
        select.dark-select {
            background-color: #374151; /* gray-700 */
            border: 1px solid #4b5563; /* gray-600 */
            color: #f3f4f6; /* gray-100 */
            border-radius: 0.375rem; /* md */
        }
        
        /* Base video styling */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }

        /* Styling for the file upload button */
        .file-upload-label {
            display: inline-flex;
            align-items: center;
            padding: 0.75rem 1.5rem; /* 12px 24px */
            background-color: #4f46e5; /* indigo-600 */
            color: white;
            font-weight: 600; /* semibold */
            border-radius: 0.5rem; /* lg */
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }
        .file-upload-label:hover {
            background-color: #4338ca; /* indigo-700 */
        }

        /* This ensures the player screen takes full height */
        #player-screen {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* The overlay must be explicitly sized to cover the video */
        #tap-overlay {
            cursor: pointer;
        }
    </style>
</head>
<body class="p-0 sm:p-4">

    <!-- View 1: Upload Screen (Default) -->
    <div id="upload-screen" class="w-full h-full flex flex-col items-center justify-center p-4 text-center">
        <h1 class="text-3xl font-bold text-white mb-6">Video Frame Analyzer</h1>
        <p class="text-lg text-gray-400 mb-8 max-w-md">Select a video file to begin analyzing frame-by-frame.</p>
        <label for="video-upload" class="file-upload-label shadow-lg">
            <i class="ph-upload-simple ph-lg mr-2"></i>
            Select Video
        </label>
        <input type="file" id="video-upload" accept="video/*" class="hidden"/>
    </div>

    <!-- View 2: Player Screen (Hidden by default) -->
    <div id="player-screen" class="hidden">
        
        <!-- Top Bar: Back Button & NEW Play/Pause Button -->
        <div class="flex-shrink-0 p-3 bg-gray-900 shadow-md flex justify-between items-center">
            <!-- Back Button -->
            <button id="back-btn" class="flex items-center text-sm font-medium text-indigo-400 hover:text-indigo-300 transition-colors">
                <i class="ph-arrow-left ph-md mr-1"></i>
                Back to Select
            </button>
            
            <!-- NEW PLAY/PAUSE BUTTON -->
            <button id="top-play-pause-btn" class="p-2 rounded-full text-white bg-indigo-600 hover:bg-indigo-700 transition-colors">
                <i id="top-play-pause-icon" class="ph-play ph-lg"></i>
            </button>
        </div>

        <!-- Main Content: Video Player -->
        <div class="flex-grow flex items-center justify-center min-h-0 bg-black">
            <!-- video-wrapper is the element that will go fullscreen -->
            <div id="video-wrapper" class="w-full h-full relative">
                <video id="video" playsinline>
                    Your browser does not support the video tag.
                </video>
                <!-- This overlay captures all taps/swipes to prevent native controls -->
                <div id="tap-overlay" class="absolute top-0 left-0 w-full h-full z-10"></div>
            </div>
        </div>
        
        <!-- Message Box (placed above controls) -->
        <div id="message-box" class="hidden p-3 rounded-md bg-red-600 text-white text-center m-3"></div>

        <!-- Bottom Bar: Controls -->
        <div class="controls-bar bg-gray-800 p-3 rounded-t-lg sm:rounded-lg shadow-inner flex items-center justify-between space-x-2 md:space-x-4">
            <!-- Play/Pause Button -->
            <button id="play-pause-btn" class="p-2 rounded-full text-white bg-indigo-600 hover:bg-indigo-700 transition-colors">
                <i id="play-pause-icon" class="ph-play ph-lg"></i>
            </button>

            <!-- Time Display -->
            <div class="text-xs md:text-sm font-mono" id="time-display">
                00:00.000 / 00:00.000
            </div>

            <!-- Playback Speed -->
            <div class="flex items-center space-x-1 md:space-x-2">
                <label for="playback-speed" class="text-xs md:text-sm font-medium text-gray-300">Speed:</label>
                <select id="playback-speed" class="dark-select text-xs md:text-sm py-1 px-1 md:px-2">
                    <option value="0.1">0.1x</option>
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2.0x</option>
                </select>
            </div>

            <!-- FPS (Frames Per Second) Input -->
            <div class="flex items-center space-x-1 md:space-x-2">
                <label for="fps-input" class="text-xs md:text-sm font-medium text-gray-300">FPS:</label>
                <input type="number" id="fps-input" value="30" class="w-12 md:w-16 bg-gray-700 border border-gray-600 rounded-md p-1 text-sm text-center">
            </div>

            <!-- Fullscreen Button -->
            <button id="fullscreen-btn" class="p-2 rounded-full text-white hover:bg-gray-700 transition-colors">
                <i class="ph-arrows-out ph-lg"></i>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Screen elements
            const uploadScreen = document.getElementById('upload-screen');
            const playerScreen = document.getElementById('player-screen');
            const backBtn = document.getElementById('back-btn');

            // Player elements
            const videoUpload = document.getElementById('video-upload');
            const videoWrapper = document.getElementById('video-wrapper');
            const video = document.getElementById('video');
            const tapOverlay = document.getElementById('tap-overlay'); // The overlay
            
            // Control elements
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playPauseIcon = document.getElementById('play-pause-icon');
            const topPlayPauseBtn = document.getElementById('top-play-pause-btn'); // New top button
            const topPlayPauseIcon = document.getElementById('top-play-pause-icon'); // New top button icon
            
            const timeDisplay = document.getElementById('time-display');
            const playbackSpeed = document.getElementById('playback-speed');
            const fpsInput = document.getElementById('fps-input');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const messageBox = document.getElementById('message-box');

            let secondsPerFrame = 1 / 30;
            let isSeeking = false;
            let currentVideoURL = null;

            // --- Swipe/Tap detection variables ---
            let touchstartX = 0;
            let touchstartY = 0;
            let isSwiping = false; // Flag to track if a swipe is in progress
            const swipeThreshold = 100; // Min pixels for a vertical swipe
            const swipeRestraint = 50; // Max horizontal pixels allowed during vertical swipe
            const swipeMoveThreshold = 10; // Min pixels to move before it's considered a swipe

            // --- Show Error Message ---
            function showMessage(message, isError = true) {
                console.log(isError ? "Error:" : "Message:", message); // Also log to console
                messageBox.textContent = message;
                messageBox.className = isError 
                    ? 'p-3 rounded-md bg-red-600 text-white text-center m-3 block' 
                    : 'p-3 rounded-md bg-green-600 text-white text-center m-3 block';
                messageBox.classList.remove('hidden');
                setTimeout(() => {
                    messageBox.classList.add('hidden');
                }, 4000); // Increased time to 4 seconds
            }

            // --- UI Navigation ---
            videoUpload.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    if (currentVideoURL) {
                        URL.revokeObjectURL(currentVideoURL);
                    }
                    currentVideoURL = URL.createObjectURL(file);
                    video.src = currentVideoURL;
                    video.load();
                    uploadScreen.classList.add('hidden');
                    playerScreen.classList.remove('hidden');
                }
            });

            backBtn.addEventListener('click', () => {
                video.pause();
                if (currentVideoURL) {
                    URL.revokeObjectURL(currentVideoURL);
                    currentVideoURL = null;
                }
                video.src = '';
                video.load();
                videoUpload.value = null;
                timeDisplay.textContent = "00:00.000 / 00:00.000";
                // Reset both icons
                playPauseIcon.classList.remove('ph-pause');
                playPauseIcon.classList.add('ph-play');
                topPlayPauseIcon.classList.remove('ph-pause');
                topPlayPauseIcon.classList.add('ph-play');
                playerScreen.classList.add('hidden');
                uploadScreen.classList.remove('hidden');
            });

            // --- Video Loaded Metadata ---
            video.addEventListener('loadedmetadata', () => {
                updateTimeDisplay();
                updateSecondsPerFrame();
            });

            // --- CRITICAL CHANGE: Control: Play/Pause with Error Catching ---
            function togglePlayPause() {
                console.log("togglePlayPause() called. Video paused:", video.paused);
                if (video.paused || video.ended) {
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            // Playback started successfully!
                            console.log("Playback started.");
                        }).catch(error => {
                            // Playback failed! This is the 'Aha!' moment.
                            console.error("Playback failed:", error);
                            // Show the user the error!
                            showMessage(`Playback blocked: ${error.name}. Tap again.`);
                        });
                    }
                } else {
                    video.pause();
                    console.log("Playback paused.");
                }
            }
            
            // Add listeners to both buttons
            playPauseBtn.addEventListener('click', () => {
                console.log("Bottom play/pause button clicked.");
                togglePlayPause();
            });
            topPlayPauseBtn.addEventListener('click', () => {
                console.log("Top play/pause button clicked.");
                togglePlayPause();
            });

            // --- Control: Fullscreen ---
            fullscreenBtn.addEventListener('click', () => {
                if (videoWrapper.requestFullscreen) {
                    videoWrapper.requestFullscreen();
                } else if (videoWrapper.webkitRequestFullscreen) { /* Safari */
                    videoWrapper.webkitRequestFullscreen();
                } else if (videoWrapper.msRequestFullscreen) { /* IE11 */
                    videoWrapper.msRequestFullscreen();
                }
            });

            // --- Control: Playback Speed ---
            playbackSpeed.addEventListener('change', () => {
                video.playbackRate = parseFloat(playbackSpeed.value);
            });

            // --- Control: FPS Input ---
            function updateSecondsPerFrame() {
                const fps = parseFloat(fpsInput.value);
                if (fps > 0) {
                    secondsPerFrame = 1 / fps;
                } else {
                    showMessage("FPS must be a positive number.");
                    fpsInput.value = 30;
                    secondsPerFrame = 1 / 30;
                }
            }
            fpsInput.addEventListener('change', updateSecondsPerFrame);

            // --- Control: Frame Step ---
            function frameStep(direction) {
                if (!video.duration) return;
                video.pause();
                let newTime = video.currentTime + (direction * secondsPerFrame);
                if (newTime < 0) newTime = 0;
                if (newTime > video.duration) newTime = video.duration;
                video.currentTime = newTime;
            }
            
            
            // --- REFACTORED: Interaction Handlers on the Overlay ---
            
            // 1. Handle Click (for Taps)
            tapOverlay.addEventListener('click', (e) => {
                console.log("Tap overlay clicked. isSwiping:", isSwiping);
                // If the 'isSwiping' flag was set by touch events,
                // don't register this 'click' event.
                if (isSwiping) {
                    return;
                }

                const rect = tapOverlay.getBoundingClientRect();
                const tapX = e.clientX - rect.left; // Use clientX for click events
                const videoWidth = rect.width;

                if (tapX < videoWidth * 0.4) {
                    console.log("Frame step backward.");
                    frameStep(-1);
                } else if (tapX > videoWidth * 0.6) {
                    console.log("Frame step forward.");
                    frameStep(1);
                } else {
                    // This is the tap-to-play/pause
                    console.log("Center tap for play/pause.");
                    togglePlayPause();
                }
            });

            // 2. Handle Touch Start (to detect swipes)
            tapOverlay.addEventListener('touchstart', (e) => {
                touchstartX = e.touches[0].clientX;
                touchstartY = e.touches[0].clientY;
                isSwiping = false; // Reset on new touch
            }, { passive: true }); // Use passive for performance

            // 3. Handle Touch Move (to flag a swipe)
            tapOverlay.addEventListener('touchmove', (e) => {
                if (isSwiping || e.touches.length === 0) return; // Already flagged or no touches
                
                let moveX = e.touches[0].clientX;
                let moveY = e.touches[0].clientY;
                let dx = Math.abs(moveX - touchstartX);
                let dy = Math.abs(moveY - touchstartY);

                // If moved more than the threshold, it's a swipe.
                if (dx > swipeMoveThreshold || dy > swipeMoveThreshold) {
                    isSwiping = true;
                }
            }, { passive: true });

            // 4. Handle Touch End (NOW ONLY FOR SWIPE-TO-EXIT)
            tapOverlay.addEventListener('touchend', (e) => {
                // Check for swipe-to-exit-fullscreen
                if (isSwiping && (document.fullscreenElement || document.webkitFullscreenElement)) {
                    let touchendX = e.changedTouches[0].clientX;
                    let touchendY = e.changedTouches[0].clientY;
                    let dy = touchendY - touchstartY;
                    let dx = touchendX - touchstartX;

                    // Check for a clear *downward* swipe
                    if (dy > swipeThreshold && Math.abs(dx) < swipeRestraint) {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        } else if (document.webkitExitFullscreen) { /* Safari */
                            document.webkitExitFullscreen();
                        }
                    }
                }
            });


            // --- Video Event Listeners for UI Updates ---
            video.addEventListener('play', () => {
                // Update both icons
                playPauseIcon.classList.remove('ph-play');
                playPauseIcon.classList.add('ph-pause');
                topPlayPauseIcon.classList.remove('ph-play');
                topPlayPauseIcon.classList.add('ph-pause');
            });
            video.addEventListener('pause', () => {
                // Update both icons
                playPauseIcon.classList.remove('ph-pause');
                playPauseIcon.classList.add('ph-play');
                topPlayPauseIcon.classList.remove('ph-pause');
                topPlayPauseIcon.classList.add('ph-play');
            });
            video.addEventListener('timeupdate', () => {
                if (!isSeeking) updateTimeDisplay();
            });
            video.addEventListener('seeking', () => { isSeeking = true; });
            video.addEventListener('seeked', () => { 
                isSeeking = false; 
                updateTimeDisplay();
            });

            // --- Utility: Format Time ---
            function formatTime(seconds) {
                const min = Math.floor(seconds / 60);
                const sec = Math.floor(seconds % 60);
                const ms = Math.floor((seconds - Math.floor(seconds)) * 1000);
                return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${ms.toString().padStart(3, '0')}`;
            }

            // --- Utility: Update Time Display ---
            function updateTimeDisplay() {
                const current = formatTime(video.currentTime || 0);
                const duration = formatTime(video.duration || 0);
                timeDisplay.textContent = `${current} / ${duration}`;
            }
        });
    </script>

    <script>
        // --- CRITICAL CHANGE: PWA CACHE BUSTING SCRIPT ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => {
                        console.log('Service worker registered.', reg);

                        // Check if a new worker is waiting
                        if (reg.waiting) {
                            console.log('New service worker waiting. Activating...');
                            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                            // Don't reload here, wait for the controller change
                        }

                        // Listen for new worker installation
                        reg.addEventListener('updatefound', () => {
                            console.log('New service worker update found.');
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('New service worker installed. Forcing activation.');
                                    // Send skipWaiting message to the new worker
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        });
                    })
                    .catch((err) => {
                        console.error('Service worker registration failed:', err);
                    });

                // Listen for when the new worker has taken control
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    console.log('Service worker has changed. Reloading page...');
                    window.location.reload();
                });
            });
        }
    </script>

</body>
</html>
